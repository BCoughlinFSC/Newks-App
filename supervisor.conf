; ─────────────────────────────────────────────────────────────
; Newk's Reporting Platform – Supervisor Configuration
; ─────────────────────────────────────────────────────────────
; Keeps the app running 24/7 on Cloudways.
;
; SETUP (run once via SSH):
;   sudo cp /home/master/applications/wpftndhcuj/public_html/supervisor.conf \
;            /etc/supervisor/conf.d/newks_app.conf
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start all
;
; USEFUL COMMANDS:
;   sudo supervisorctl status                          ← check if running
;   sudo supervisorctl restart all                     ← restart after code changes
;   sudo tail -f /var/log/newks_app.out.log            ← view FastAPI logs
;   sudo tail -f /var/log/newks_menuboard.out.log      ← view menuboard logs
; ─────────────────────────────────────────────────────────────

[program:newks_app]
command=/home/master/applications/wpftndhcuj/public_html/backend/venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2
directory=/home/master/applications/wpftndhcuj/public_html/backend
user=master
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stderr_logfile=/var/log/newks_app.err.log
stdout_logfile=/var/log/newks_app.out.log
environment=HOME="/home/master",USER="master"

[program:newks_menuboard]
command=/usr/bin/node server/index.js
directory=/home/master/applications/wpftndhcuj/public_html/newks-menuboard
user=master
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stderr_logfile=/var/log/newks_menuboard.err.log
stdout_logfile=/var/log/newks_menuboard.out.log
environment=HOME="/home/master",USER="master",NODE_ENV="production",PORT="8787"
