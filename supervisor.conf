; ─────────────────────────────────────────────────────────────
; Newk's Reporting Platform – Supervisor Configuration
; ─────────────────────────────────────────────────────────────
; Keeps the app running 24/7 on Cloudways.
;
; SETUP (run once via SSH):
;   sudo cp /home/master/applications/newks/supervisor.conf \
;            /etc/supervisor/conf.d/newks_app.conf
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start newks_app
;
; USEFUL COMMANDS:
;   sudo supervisorctl status newks_app          ← check if running
;   sudo supervisorctl restart newks_app         ← restart after code changes
;   sudo tail -f /var/log/newks_app.out.log      ← view live logs
;   sudo tail -f /var/log/newks_app.err.log      ← view error logs
; ─────────────────────────────────────────────────────────────

[program:newks_app]
command=/home/master/applications/newks/backend/venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2
directory=/home/master/applications/newks/backend
user=master
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stderr_logfile=/var/log/newks_app.err.log
stdout_logfile=/var/log/newks_app.out.log
environment=HOME="/home/master",USER="master"
