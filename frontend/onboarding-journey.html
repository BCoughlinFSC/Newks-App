<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Newk's — Franchisee Opening Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="onboarding-theme.css">
<style>
  *{box-sizing:border-box;}
  body{margin:0;background:#FAF6EF;}
  /* topbar (page-specific — theme is scoped under .nro) */
  .topbar{position:sticky;top:0;z-index:60;background:#1F2328;color:#fff;border-bottom:3px solid #D9272C;}
  .topbar-inner{max-width:1120px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .brand-lockup{display:flex;align-items:center;gap:12px;}
  .logo{display:inline-flex;align-items:center;background:#D9272C;color:#fff;font-family:'Poppins';font-weight:800;font-size:19px;letter-spacing:.5px;padding:6px 12px;border-radius:8px;line-height:1;}
  .logo sup{font-size:11px;}
  .brand-txt{display:flex;flex-direction:column;line-height:1.15;}
  .brand-txt .t1{font-family:'Poppins';font-weight:700;font-size:15px;}
  .brand-txt .t2{font-size:11px;color:#c9ccd1;letter-spacing:.4px;text-transform:uppercase;}
  .topbar .spacer{flex:1;}
  .ticket{font-size:12.5px;color:#F6D9DD;text-decoration:none;border:1px solid rgba(255,255,255,.35);border-radius:7px;padding:8px 13px;}
  .ticket:hover{background:rgba(255,255,255,.12);color:#fff;}
  .wrap{max-width:1120px;margin:0 auto;padding:24px 22px 80px;}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#1F2328;color:#fff;padding:.6rem 1.1rem;border-radius:8px;font-size:.85rem;box-shadow:0 8px 30px rgba(0,0,0,.25);opacity:0;transition:.25s;pointer-events:none;z-index:80;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.err{background:#8a1f1f;}
  .loadwrap{max-width:1120px;margin:60px auto;text-align:center;color:#8A8F98;font-family:'Inter',sans-serif;}
</style>
</head>
<body>
  <header class="topbar"><div class="topbar-inner">
    <div class="brand-lockup">
      <span class="logo">Newk's<sup>&reg;</sup></span>
      <div class="brand-txt"><span class="t1">Franchisee Opening Hub</span><span class="t2">New Restaurant Opening</span></div>
    </div>
    <div class="spacer"></div>
    <a class="ticket" href="https://newksit.freshdesk.com" target="_blank" rel="noopener">Help &amp; Knowledge Base &#8599;</a>
  </div></header>

  <div class="wrap nro" id="app">
    <div class="loadwrap" id="loading">Loading your opening hub&hellip;</div>
  </div>

  <div id="toast" class="toast"></div>

<script>
const PRIO={req:'★ Required',rec:'◆ Recommended',opt:'○ Optional',cond:'⚠ Conditional'};
const TOKEN=new URLSearchParams(location.search).get('t')||'';
let DATA=null, activeTab=null, teamFilter=null;   // activeTab set from tabDefs()

// Team filter: map each task to an owning team, drawn from its normalized tags
// (Master track) or its department string (IT/Marketing tracks).
const TEAM_ORDER=['Franchisee','IT','Marketing','Training','Development','Purchasing','Accounting','Sales','Other'];
const TEAM_LABEL={Franchisee:'Franchisee (You)',IT:'IT Department',Marketing:'Marketing',
  Training:'PD&C / Training',Development:'Development',Purchasing:'Purchasing',
  Accounting:'Accounting',Sales:'Sales',Other:'Other'};
// A task can belong to several teams (e.g. a franchisee-owned Development task).
// Match-any semantics: the task shows under every team it belongs to.
function teamsOf(t){
  const s=new Set();
  if(Array.isArray(t.tags)) t.tags.forEach(x=>{
    const m=TEAM_ORDER.find(p=>p.toLowerCase()===String(x).toLowerCase());
    if(m) s.add(m);
  });
  if(!s.size){ // no normalized tags (IT track) — derive from department text
    const d=(t.dept||'').toLowerCase();
    if(/pd\s*&?\s*c|training|\bops\b/.test(d)) s.add('Training');
    else if(/market/.test(d)) s.add('Marketing');
    else if(/\bit\b|fsc/.test(d)) s.add('IT');
    else if(/purchas/.test(d)) s.add('Purchasing');
    else if(/account/.test(d)) s.add('Accounting');
    else if(/develop/.test(d)) s.add('Development');
    else if(/sales/.test(d)) s.add('Sales');
  }
  if(t.owner==='franchisee') s.add('Franchisee'); // owner marker (all tracks)
  if(!s.size) s.add('Other');
  return [...s];
}
function filterBar(counts,total){
  const teams=TEAM_ORDER.filter(t=>counts[t]).concat(Object.keys(counts).filter(t=>!TEAM_ORDER.includes(t)));
  let chips=`<button class="fchip${teamFilter===null?' active':''}" data-team="">All <span class="fc">${total}</span></button>`;
  chips+=teams.map(t=>`<button class="fchip${teamFilter===t?' active':''}" data-team="${esc(t)}">${esc(TEAM_LABEL[t]||t)} <span class="fc">${counts[t]}</span></button>`).join('');
  return `<div class="fbar"><span class="flabel">Filter by team</span>${chips}</div>`;
}

function esc(s){const d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML;}
function toast(m,e){const el=document.getElementById('toast');el.textContent=m;el.className='toast show'+(e?' err':'');
  clearTimeout(el._t);el._t=setTimeout(()=>el.className='toast'+(e?' err':''),2200);}
function fmt(iso){if(!iso)return '—';const p=String(iso).split(/[T ]/)[0].split('-');if(p.length<3)return iso;
  return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+p[1]-1]+' '+(+p[2])+', '+p[0];}
function daysUntil(iso){if(!iso)return null;const t=new Date(iso+'T00:00:00');const n=new Date();n.setHours(0,0,0,0);return Math.round((t-n)/864e5);}
function linkifyEmail(t){return esc(t).replace(/([A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,})/g,'<a href="mailto:$1">$1</a>');}

async function load(){
  if(!TOKEN){document.getElementById('loading').textContent='This link is missing its access token.';return;}
  try{
    const res=await fetch('/api/onboarding/journey/'+encodeURIComponent(TOKEN));
    if(!res.ok){document.getElementById('loading').textContent='This onboarding link is invalid or has expired.';return;}
    DATA=await res.json();
    render();
  }catch(e){document.getElementById('loading').textContent='Could not load: '+e.message;}
}

// ── Tabs are the workbook's sheets ──────────────────────────────────────────
// One tab per sheet of the 180 Day Checklist workbook, in workbook order, so
// the app's navigation and the spreadsheet people already use are the same
// thing. The IT Department sheet is its own track; the nine department sheets
// are groups inside the master track, so they get flattened out to sit
// alongside it. Everything that is NOT a page of that workbook lives after a
// divider at the end, clearly marked as reference.
const SHEET_ORDER=['IT Department','Marketing','Training (PD&C)','Development','Franchisee',
                   'Legal','Purchasing','Development & Purchasing','Accounting','Sales Team'];

function sheetTabs(){
  const tabs=[];
  const ref=DATA.reference||{};
  if(ref.nro_info) tabs.push({id:'nro',label:'NRO Info',kind:'nro'});

  const byLabel={};
  (DATA.track_views||[]).forEach(tv=>{
    if(tv.track==='it'){ byLabel['IT Department']={id:'it',label:'IT Department',kind:'track',
                                                   track:'it',count:tv.total,done:tv.done}; return; }
    if(tv.track!=='master') return;
    tv.groups.forEach(g=>{
      byLabel[g.label]={id:'m:'+g.id,label:g.label,kind:'group',track:'master',group:g.id,
                        count:g.tasks.length,done:g.tasks.filter(t=>t.done).length};
    });
  });
  SHEET_ORDER.forEach(l=>{ if(byLabel[l]) { tabs.push(byLabel[l]); delete byLabel[l]; } });
  // Anything the workbook grew since this list was written still shows up.
  Object.values(byLabel).forEach(t=>tabs.push(t));

  const extra=[];
  if(ref.contacts&&Object.keys(ref.contacts).length) extra.push({id:'contacts',label:'Vendor Contacts',kind:'ref'});
  if((ref.forms||[]).length) extra.push({id:'forms',label:'Forms',kind:'ref'});
  if((ref.itquick||[]).length) extra.push({id:'itquick',label:'IT Reference',kind:'ref'});
  if(ref.call45&&(ref.call45.sections||[]).length) extra.push({id:'call45',label:'45-Day Call',kind:'ref'});
  (DATA.track_views||[]).forEach(tv=>{
    if(tv.track==='master'||tv.track==='it') return;
    extra.push({id:tv.track,label:tv.label,kind:'track',track:tv.track,count:tv.total});
  });
  if(extra.length){ tabs.push({id:'__div',divider:true}); extra.forEach(t=>tabs.push(t)); }
  return tabs;
}

function tabDefs(){ return sheetTabs(); }

// Render whichever sheet is selected.
function renderActiveSheet(){
  const ref=DATA.reference||{};
  const def=tabDefs().find(t=>t.id===activeTab);
  if(!def) return '<div class="empty">Nothing here.</div>';
  if(def.kind==='nro')   return renderNroInfo(ref.nro_info||{});
  if(def.kind==='group'){
    const tv=(DATA.track_views||[]).find(x=>x.track===def.track);
    const g=tv&&tv.groups.find(x=>String(x.id)===String(def.group));
    return g?sheetTable(g.label,g.tasks):'<div class="empty">No tasks on this sheet.</div>';
  }
  if(def.kind==='track'){
    const tv=(DATA.track_views||[]).find(x=>x.track===def.track);
    return tv?renderTrack(tv):'<div class="empty">Nothing here.</div>';
  }
  if(def.id==='contacts') return renderContacts(ref.contacts||{});
  if(def.id==='forms')    return renderForms(ref.forms||[]);
  if(def.id==='itquick')  return renderItQuick(ref.itquick||[]);
  if(def.id==='call45')   return renderCall45(ref.call45||{sections:[]});
  return '<div class="empty">Nothing here.</div>';
}

// The workbook's cover sheet: restaurant details (live, from this opening) plus
// the Support Center directory.
// Values for the cover sheet's ten rows. Every one is now a real column on the
// opening, maintained by the Newk's team on the internal dashboard; the
// franchisee sees whatever has been filled in so far, read-only.
function nroInfoValues(o){
  const street=o.address||'';
  const loc=[o.city,o.state].filter(Boolean).join(', ');
  const dt=v=>v?(/^\d{4}-\d{2}-\d{2}$/.test(v)?fmt(v):v):'';
  return {
    'Restaurant #':        o.restaurant_number||'',
    'Restaurant Name':     o.store_name||'',
    'Address':             [street,loc].filter(Boolean).join(street&&loc?', ':''),
    'Telephone Number':    o.phone||'',
    'Ground Breaking':     dt(o.ground_breaking),
    'Build Time':          o.build_time||'',
    'Turn Over':           dt(o.turn_over),
    'Projected Open Date': dt(o.target_open),
    'Hiring Date':         dt(o.hiring_date),
    'Training Week':       o.training_week||'',
  };
}

function renderNroInfo(info){
  const o=DATA;
  const vals=nroInfoValues(o);
  // A blank row is a detail the Support Center hasn't set yet — say so, rather
  // than leaving a shaded empty cell that reads as "your turn to fill this in".
  // No shading either: the whole sheet is read-only here.
  const rows=(info.fields||[]).map(f=>`<tr>
      <td style="width:210px;font-weight:600;background:#EAF1FB;">${esc(f)}</td>
      <td style="text-align:left;">${vals[f]?esc(vals[f])
        :'<span style="color:#9A9188;font-style:italic;">To be confirmed</span>'}</td>
    </tr>`).join('');
  const contacts=(info.contacts||[]).map(c=>`<tr>
      <td><a href="mailto:${esc(c.email)}">${esc(c.email)}</a></td>
      <td style="font-weight:600;">${esc(c.dept)}</td>
      <td>${esc(c.rep)}</td></tr>`).join('');
  return `<p style="color:#4A4F57;margin:0 0 14px;">The cover sheet for this opening — your restaurant
      details and who to contact at the Newk's Support Center for each area.</p>
    <section class="sheet">
      <div class="sheet-h"><h3>Restaurant Information</h3></div>
      <div class="wbwrap"><table class="wb wb-plain"><tbody>${rows}</tbody></table></div>
    </section>
    <section class="sheet">
      <div class="sheet-h"><h3>Support Center Contacts</h3></div>
      <div class="wbwrap"><table class="wb wb-plain">
        <thead><tr><th>Email</th><th>Department</th><th>Representative</th></tr></thead>
        <tbody>${contacts}</tbody></table></div>
    </section>
    ${info.note?`<p style="font-size:12px;color:var(--muted);font-style:italic;">${esc(info.note)}</p>`:''}`;
}

function render(){
  const o=DATA, p=o.progress||{done:0,total:0,pct:0};
  const loc=[o.city,o.state].filter(Boolean).join(', ');
  const d=daysUntil(o.target_open), cd=d===null?'—':(d<0?'Now open':d+' days');
  const tabs=tabDefs();
  if(!tabs.find(t=>t.id===activeTab&&!t.divider)) activeTab=tabs.find(t=>!t.divider)?.id;

  let h=`<section class="hero"><div class="hero-flex">
    <div class="hero-copy">
      <span class="tagpill">Skip the Line&reg;</span>
      <h1>${esc(o.store_name||"Newk's Eatery")}${loc?' — '+esc(loc):''}</h1>
      <p class="sub">Welcome${o.franchisee_name?', '+esc(o.franchisee_name):''}! This is your live opening hub. Work each checklist below — tick items as you complete them and your progress saves automatically. Items handled by the Newk's team are shown for visibility but locked.</p>
      <div class="hero-meta">
        <div class="m"><div class="k">Target Open</div><div class="v">${esc(fmt(o.target_open))}</div></div>
        <div class="m"><div class="k">Countdown</div><div class="v${d!==null&&d>=0&&d<45?' alert':''}">${cd}</div></div>
        <div class="m"><div class="k">Tasks Complete</div><div class="v">${p.done} / ${p.total}</div></div>
      </div>
    </div>
    <div class="ring-wrap"><div class="ring${p.pct>=100?' done':''}" style="--p:${p.pct}"><b>${p.pct}%</b></div><div class="cap">Overall</div></div>
  </div></section>`;

  h+=`<nav class="tabnav"><div class="tabnav-inner" id="tabnav">${tabs.map(t=>
    t.divider
      ? `<span class="tabdiv" aria-hidden="true"></span>`
      : `<button class="tabbtn${t.id===activeTab?' active':''}" data-tab="${t.id}">${esc(t.label)}${t.count!=null?` <span class="n">${t.count}</span>`:''}</button>`).join('')}</div></nav>`;

  h+=`<div id="tabbody"></div>`;
  const app=document.getElementById('app');app.innerHTML=h;
  document.querySelectorAll('#tabnav .tabbtn').forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;teamFilter=null;render();});
  renderTab();
}

function renderTab(){
  document.getElementById('tabbody').innerHTML=renderActiveSheet();
  // wire filter chips + checkboxes + notes
  document.querySelectorAll('#tabbody .fchip').forEach(c=>c.onclick=()=>{teamFilter=c.dataset.team||null;renderTab();});
  document.querySelectorAll('#tabbody .wb-c input:not(:disabled)').forEach(cb=>cb.onchange=()=>setTask(cb.dataset.key,cb));
  document.querySelectorAll('#tabbody .notebox').forEach(inp=>inp.onblur=()=>saveNote(inp.dataset.key,inp));
  document.querySelectorAll('#tabbody .qbtn').forEach(b=>b.onclick=()=>toggleQForm(b.dataset.qkey,true));
  document.querySelectorAll('#tabbody .qcancel').forEach(b=>b.onclick=()=>toggleQForm(b.dataset.qcancel,false));
  document.querySelectorAll('#tabbody .qsend').forEach(b=>b.onclick=()=>sendQuestion(b.dataset.qsend,b));
  document.querySelectorAll('#tabbody .phase-h').forEach(hh=>hh.onclick=()=>hh.closest('.phase').classList.toggle('collapsed'));
}

// ── Workbook table rendering ────────────────────────────────────────────────
// The source of truth is Kim's 180 Day Checklist workbook, and everyone using
// this already knows that sheet. So render each department as the sheet itself:
// same columns, same order, furthest-out week first — rather than as cards they
// would have to map back onto the workbook in their head.
function wkClass(w){ if(w==null) return 'later'; return w<=2?'urgent':(w<=6?'soon':'later'); }
function wkText(w){ if(w==null) return '—'; return Number.isInteger(w)?String(w):String(w); }

function linkifyInfo(s){
  if(!s) return '';
  // Contact-info cells hold emails, phone numbers and the odd URL, often several
  // at once separated by spaces or newlines.
  return esc(s)
    .replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>')
    .replace(/([A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,})/gi,'<a href="mailto:$1">$1</a>')
    .replace(/\n/g,'<br>');
}

// One column shape for every sheet, IT included — see onboarding.html for the
// reasoning. Weeks Out is read-only here; only staff correct the timing.
// "Completion Date" is gone: it was the auto-stamped tick date, now a caption
// under the checkbox.
const WB_COLS = ['Weeks Out','Done','Activity To Complete',
                 'Company','Vendor Contact','Vendor Contact Info.',"Newk's Resources"];
const WB_COLGROUP=`<colgroup><col style="width:72px;"><col style="width:52px;"><col style="width:34%;"><col style="width:12%;"><col style="width:11%;"><col style="width:16%;"><col style="width:11%;"></colgroup>`;

// One <tr>, the same on every sheet. The IT Department tab used to have its own
// column set; it now renders in this shape too, with its description, Required?
// pill, KB link and original Timing text folded into the activity/weeks cells.
const PRIO_LABEL={req:'★ Required',rec:'◆ Recommended',opt:'○ Optional',cond:'⚠ Conditional'};

function wbRow(t){
  const locked=t.locked;
  const q=(t.questions||[]);
  const openQ=q.filter(x=>x.status==='open').length;
  return `<tr class="${t.done?'done':''}" data-row="${esc(t.key)}">
    <td><span class="wb-wk ${wkClass(t.weeks)}">${esc(wkText(t.weeks))}</span>${
      t.lead&&t.weeks_source!=='workbook'?`<div class="wk-lead">${esc(t.lead)}</div>`:''}</td>
    <td class="wb-c"><input type="checkbox" data-key="${esc(t.key)}" ${t.done?'checked':''} ${locked?'disabled':''}
        title="${locked?"Handled by the Newk's team":'Mark complete'}" aria-label="Complete: ${esc(t.title)}">
      ${t.done&&t.done_at?`<div class="wb-doneat">${esc(fmt(t.done_at))}</div>`:''}</td>
    <td>
      <div class="wb-act">${esc(t.title)}<span class="wb-own ${locked?'newks':'you'}">${locked?"Newk's":'You'}</span>${
        t.prio?`<span class="wb-prio ${t.prio}">${PRIO_LABEL[t.prio]||t.prio}</span>`:''}</div>
      ${t.desc?`<div style="color:var(--ink-soft);font-size:11.5px;margin-top:3px;">${esc(t.desc)}</div>`:''}
      ${t.kb?`<div class="wb-kb" style="margin-top:3px;">📄 <a href="${esc(t.kb)}" target="_blank" rel="noopener">Guide</a></div>`:''}
      <div class="wb-sub">
        ${!locked?`<input class="wb-note notebox" data-key="${esc(t.key)}" placeholder="Add a note…" value="${esc(t.note||'')}">`:''}
        <button type="button" class="wb-ask qbtn" data-qkey="${esc(t.key)}">💬 ${q.length?`${q.length} question${q.length>1?'s':''}${openQ?' · awaiting reply':''}`:'Ask a question'}</button>
      </div>
      ${questionBlock(t,true)}
    </td>
    <td>${esc(t.company||'')}</td>
    <td>${esc(t.contact||'')}</td>
    <td>${linkifyInfo(t.contact_info||'')}</td>
    <td>${esc(t.dept||'')}</td>
  </tr>`;
}

function sheetTable(label, tasks){
  const done = tasks.filter(t=>t.done).length;
  return `<section class="sheet">
    <div class="sheet-h"><h3>${esc(label)}</h3><span class="cnt">${done} of ${tasks.length} complete</span></div>
    <div class="wbwrap"><table class="wb">
      ${WB_COLGROUP}
      <thead><tr>${WB_COLS.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead>
      <tbody>${tasks.map(wbRow).join('')}</tbody>
    </table></div>
  </section>`;
}

function renderTrack(tv){
  let h='';
  if(tv.blurb) h+=`<p style="color:#4A4F57;margin:0 0 14px;">${esc(tv.blurb)}</p>`;
  if((tv.accounts||[]).length){
    h+=`<div class="card"><div class="card-b"><h4 style="margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:#8A8F98;">Marketing Accounts &amp; Kits</h4>
      <div class="dir-grid">${tv.accounts.map(a=>`<div class="dir-item"><div class="r">${a.url?`<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.name)} &#8599;</a>`:esc(a.name)}</div><div class="sd">${esc(a.desc||'')}</div></div>`).join('')}</div></div></div>`;
  }
  const counts={};
  const trackTotal=tv.groups.reduce((n,g)=>n+g.tasks.length,0);
  tv.groups.forEach(g=>g.tasks.forEach(t=>teamsOf(t).forEach(k=>{counts[k]=(counts[k]||0)+1;})));
  const deptCount=Object.keys(counts).filter(k=>k!=='Franchisee').length;
  if(deptCount>=2){ h+=filterBar(counts,trackTotal); }
  else { teamFilter=null; }

  let shown=0;
  tv.groups.forEach(g=>{
    const tasks=teamFilter?g.tasks.filter(t=>teamsOf(t).includes(teamFilter)):g.tasks;
    if(!tasks.length) return;
    shown+=tasks.length;
    h+=sheetTable(g.label, tasks);
  });
  if(!shown) h+=`<div class="empty">No ${teamFilter?esc(TEAM_LABEL[teamFilter]||teamFilter)+' ':''}tasks in this checklist.</div>`;
  return h||'<div class="empty">No tasks in this section yet.</div>';
}

function questionBlock(t,compact){
  const qs=t.questions||[];
  const thread=qs.length?`<div class="qthread">${qs.map(q=>`
    <div class="qitem">
      <div class="qq">${esc(q.body)}</div>
      <div class="qmeta">Asked by ${esc(q.asked_by||'you')} · ${esc(fmt(q.asked_at))}
        ${q.status==='answered'?'<span class="qbadge answered">Answered</span>':'<span class="qbadge">Awaiting reply</span>'}</div>
      ${q.answer?`<div class="qa"><span class="lbl">${esc(q.answered_by||"Newk's team")} replied</span>${esc(q.answer)}</div>`:''}
    </div>`).join('')}</div>`:'';
  return `<div class="qwrap">
    ${thread}
    ${compact?'':`<button type="button" class="qbtn" data-qkey="${esc(t.key)}">💬 ${qs.length?'Ask another question':'Ask a question'}</button>`}
    <div class="qform" data-qform="${esc(t.key)}">
      <textarea placeholder="What would you like to ask about this task?" aria-label="Your question about ${esc(t.title)}"></textarea>
      <div class="qactions">
        <button type="button" class="qsend" data-qsend="${esc(t.key)}">Send to Newk's</button>
        <button type="button" class="qcancel" data-qcancel="${esc(t.key)}">Cancel</button>
      </div>
    </div>
  </div>`;
}

function renderItQuick(groups){
  let h='<p style="color:#4A4F57;margin:0 0 14px;">Every IT vendor and system for your opening, with its setup guide and sign-up form. Tick the tasks themselves off on the IT Department tab.</p>';
  groups.forEach(g=>{
    h+=`<section class="card"><div class="card-h"><span class="ico">&#9776;</span><h2>${esc(g.title)}</h2></div><div class="card-b"><div class="dir-grid">`;
    h+=g.items.map(i=>`<div class="dir-item">
      <div class="r">${i.url?`<a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.name)} &#8599;</a>`:esc(i.name)}</div>
      <div class="sd">${esc(i.desc||'')}</div>
      ${i.form_url?`<div style="margin-top:5px;font-size:12px;">&#128221; <a href="${esc(i.form_url)}" target="_blank" rel="noopener">Open the form &#8599;</a></div>`:''}
      <div style="margin-top:7px;display:flex;gap:6px;flex-wrap:wrap;">${i.req?`<span class="req ${i.req.toLowerCase().startsWith('req')?'req':'opt'}">${esc(i.req)}</span>`:''}${i.timing?`<span class="lead">${esc(i.timing)}</span>`:''}${i.dept?`<span class="chip">${esc(i.dept)}</span>`:''}</div>
    </div>`).join('');
    h+=`</div></div></section>`;
  });
  return h;
}

function renderContacts(contacts){
  let h='<p style="color:#4A4F57;margin:0 0 14px;">Your vendor and support directory for the opening.</p>';
  Object.keys(contacts).forEach(gk=>{
    const g=contacts[gk]; const rows=g.rows||[];
    h+=`<div class="cgroup"><div class="gh">${esc(gk)} <span class="cnt">${rows.length}</span></div><div class="ccards">`;
    h+=rows.map(r=>{
      const req=(r['Required vs Optional']||'');
      return `<div class="ccard">
        <div class="cn">${esc(r.Vendor||r['Contact Name']||'—')}${req?`<span class="cbadge ${/required/i.test(req)?'req':''}">${esc(req)}</span>`:''}</div>
        ${r['Contact Name']&&r.Vendor?`<div class="cr">${esc(r['Contact Name'])}${r.Role?' · '+esc(r.Role):''}</div>`:(r.Role?`<div class="cr">${esc(r.Role)}</div>`:'')}
        ${r.Email?`<div class="ce">${linkifyEmail(r.Email)}</div>`:''}
        ${r.Phone?`<div class="cp">${esc(r.Phone)}</div>`:''}
      </div>`;
    }).join('');
    h+=`</div></div>`;
  });
  return h;
}

function renderForms(forms){
  return `<p style="color:#4A4F57;margin:0 0 14px;">Key forms &amp; sign-ups.</p><div class="dir-grid">`+
    forms.map(f=>`<div class="dir-item"><div class="r"><a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name)} &#8599;</a></div></div>`).join('')+`</div>`;
}

function renderCall45(call45){
  let h='<p style="color:#4A4F57;margin:0 0 14px;">Status checklist reviewed on the 45-Day call.</p>';
  (call45.sections||[]).forEach(s=>{
    h+=`<div class="card"><div class="card-b"><div class="qsection"><div class="qh">${esc(s.title)}</div>`;
    h+=s.items.map(i=>`<div class="qitem"><div class="qt">${esc(i.text)}</div>${i.yn?'<span class="qyn">Y / N</span>':''}</div>`).join('');
    h+=`</div></div></div>`;
  });
  return h;
}

async function setTask(key,cb){
  const done=cb.checked; cb.disabled=true;
  try{
    const res=await fetch('/api/onboarding/journey/'+encodeURIComponent(TOKEN)+'/tasks/'+encodeURIComponent(key),
      {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({done})});
    if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.detail||res.status);}
    // update local model + progress
    let task=null;
    (DATA.track_views||[]).forEach(tv=>tv.groups.forEach(g=>g.tasks.forEach(t=>{if(t.key===key)task=t;})));
    if(task){task.done=done;task.done_at=done?new Date().toISOString():null;task.done_by=done?(DATA.franchisee_name||'You'):null;}
    recompute();
    render();
    toast(done?'Marked complete ✓':'Marked open');
  }catch(e){cb.checked=!done;cb.disabled=false;toast('Could not save: '+e.message,true);}
}

async function saveNote(key,inp){
  const note=inp.value;
  try{
    await fetch('/api/onboarding/journey/'+encodeURIComponent(TOKEN)+'/tasks/'+encodeURIComponent(key),
      {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({note})});
    let task=null;(DATA.track_views||[]).forEach(tv=>tv.groups.forEach(g=>g.tasks.forEach(t=>{if(t.key===key)task=t;})));
    if(task)task.note=note;
    toast('Note saved');
  }catch(e){toast('Could not save note',true);}
}

function findTask(key){
  let task=null;
  (DATA.track_views||[]).forEach(tv=>tv.groups.forEach(g=>g.tasks.forEach(t=>{if(t.key===key)task=t;})));
  return task;
}

function toggleQForm(key,open){
  const f=document.querySelector(`#tabbody .qform[data-qform="${CSS.escape(key)}"]`);
  if(!f) return;
  f.classList.toggle('open',open);
  if(open) f.querySelector('textarea').focus(); else f.querySelector('textarea').value='';
}

async function sendQuestion(key,btn){
  const f=document.querySelector(`#tabbody .qform[data-qform="${CSS.escape(key)}"]`);
  const ta=f&&f.querySelector('textarea');
  const body=(ta?ta.value:'').trim();
  if(!body){toast('Type your question first',true);return;}
  btn.disabled=true; btn.textContent='Sending…';
  try{
    const res=await fetch('/api/onboarding/journey/'+encodeURIComponent(TOKEN)+
        '/tasks/'+encodeURIComponent(key)+'/question',
      {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({body})});
    if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.detail||res.status);}
    const out=await res.json();
    const task=findTask(key);
    if(task){ (task.questions=task.questions||[]).push(out.question); task.open_questions=(task.open_questions||0)+1; }
    render();
    // The dashboard always records it; the email is best-effort on top.
    toast(out.notified?"Sent — the Newk's team has been emailed"
                      :'Question saved — the team will see it on the dashboard');
  }catch(e){
    btn.disabled=false; btn.textContent="Send to Newk's";
    toast('Could not send: '+e.message,true);
  }
}

function recompute(){
  let done=0,total=0;
  (DATA.track_views||[]).forEach(tv=>{
    let td=0,tt=0;
    tv.groups.forEach(g=>g.tasks.forEach(t=>{tt++;if(t.done)td++;}));
    tv.done=td;tv.total=tt;tv.pct=tt?Math.round(td/tt*100):0;done+=td;total+=tt;
  });
  DATA.progress={done,total,pct:total?Math.round(done/total*100):0};
}

load();
</script>
</body>
