<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Restaurant Phone List by State — Newk's Reporting Platform</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    /*
     * In-app rebuild of the legacy SSRS "/TechSupport/Restaurant Phone list by
     * State" (emailed monthly to supportcenter + itdepartment until the SSRS
     * subscriptions were retired 2026-09-02). Open stores only, grouped by
     * state, sourced from the app's contacts DB.
     *
     * Data:   GET /api/contacts/report/phone-list-by-state  (JSON)
     * Export: same endpoint with ?format=csv
     */
    :root {
      --newks-red:   #C41E3A;
      --newks-red-d: #A01A2E;
      --ink:         #1F2937;
      --ink-muted:   #6B7280;
      --line:        #E5E7EB;
      --line-soft:   #F3F4F6;
      --bg:          #F8FAFC;
      --card:        #FFFFFF;
      --navy:        #1E3A5F;
      --warn-bg:     #FEF3C7;
      --warn-ink:    #92400E;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    .header {
      background: var(--newks-red);
      padding: 1.25rem 2rem;
      border-bottom: 3px solid var(--newks-red-d);
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .header-content {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 1rem;
    }
    .header h1 { margin: 0; color: #fff; font-size: 1.55rem; font-weight: 700; }
    .header p  { margin: 0.35rem 0 0; color: rgba(255,255,255,0.9); font-size: 0.88rem; }
    .header-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .btn {
      background: rgba(255,255,255,0.15);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.35);
      padding: 0.5rem 0.9rem;
      border-radius: 6px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex; align-items: center; gap: 0.4rem;
    }
    .btn:hover { background: rgba(255,255,255,0.28); }
    .btn:disabled { opacity: 0.5; cursor: default; }

    main { padding: 1.5rem 2rem; }

    .toolbar {
      display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0.85rem 1rem;
      margin-bottom: 1rem;
    }
    .toolbar input[type="search"], .toolbar select {
      padding: 0.5rem 0.7rem;
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: 0.9rem;
      color: var(--ink);
      background: #fff;
    }
    .toolbar input[type="search"] { min-width: 240px; flex: 1 1 240px; }
    .toolbar .count {
      margin-left: auto;
      color: var(--ink-muted);
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .toolbar .field-label {
      font-size: 0.78rem; color: var(--ink-muted);
      text-transform: uppercase; letter-spacing: 0.4px; font-weight: 600;
    }
    .toolbar label.check {
      display: inline-flex; align-items: center; gap: 0.35rem;
      font-size: 0.85rem; color: var(--ink); cursor: pointer;
    }

    .table-wrap {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow-x: auto;
    }
    table.report {
      border-collapse: collapse;
      width: 100%;
      font-size: 0.85rem;
    }
    table.report thead th {
      position: sticky; top: 0;
      background: var(--navy);
      color: #fff;
      text-align: left;
      padding: 0.55rem 0.7rem;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      font-weight: 700;
      white-space: nowrap;
      z-index: 1;
    }
    table.report tbody td {
      padding: 0.45rem 0.7rem;
      border-bottom: 1px solid var(--line-soft);
      vertical-align: top;
    }
    table.report tbody tr:hover { background: #F1F6FC; }
    tr.group-start td { border-top: 2px solid var(--line); }
    td.state-cell { font-weight: 700; color: var(--navy); white-space: nowrap; }
    td.nowrap { white-space: nowrap; }
    td.mono { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 0.8rem; }
    td.empty { color: #C7CDD3; }
    td.flag { background: var(--warn-bg); color: var(--warn-ink); font-weight: 600; }
    td.store-name a { color: var(--ink); text-decoration: none; }
    td.store-name a:hover { color: var(--newks-red); text-decoration: underline; }

    .state {
      max-width: 620px; margin: 3rem auto; text-align: center;
      background: var(--card); border: 1px solid var(--line);
      border-radius: 12px; padding: 2rem;
    }
    .state.error { background: #FEF2F2; border-color: #FECACA; color: #991B1B; }

    @media (max-width: 640px) {
      .header { padding: 1rem; }
      main { padding: 1rem; }
    }

    /* Print: drop chrome, let the table flow across pages */
    @media print {
      .header-actions, .toolbar, .home-btn { display: none !important; }
      .header { background: #fff !important; border-bottom: 2px solid #000; box-shadow: none; }
      .header h1, .header p { color: #000 !important; }
      main { padding: 0; }
      .table-wrap { border: none; border-radius: 0; overflow: visible; }
      table.report { font-size: 8pt; }
      table.report thead th { background: #ddd !important; color: #000 !important; position: static; }
      td.flag { background: none !important; color: inherit; font-weight: normal; }
      tr { break-inside: avoid; }
      @page { size: landscape; margin: 0.4in; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-content">
      <div>
        <h1>Restaurant Phone List by State</h1>
        <p id="subtitle">Open restaurants — from the in-app contacts database.</p>
      </div>
      <div class="header-actions">
        <button id="csv-btn" class="btn" title="Download as CSV">⬇ CSV</button>
        <button id="print-btn" class="btn" title="Print / Save as PDF">🖨 Print</button>
        <a href="/contacts.html" class="btn home-btn">← Contacts</a>
      </div>
    </div>
  </div>

  <main>
    <div class="toolbar" id="toolbar" style="display:none;">
      <input type="search" id="search" placeholder="Search store, city, phone, operator…" />
      <span class="field-label">State</span>
      <select id="state-filter"><option value="">All</option></select>
      <span class="field-label">Operator</span>
      <select id="operator-filter"><option value="">All</option></select>
      <label class="check" title="Phone missing or a 111-111-1111 placeholder">
        <input type="checkbox" id="flag-only" /> Missing / placeholder phone only
      </label>
      <span class="count" id="count"></span>
    </div>

    <div id="content">
      <div class="state">Loading phone list…</div>
    </div>
  </main>

  <script>
    const authToken = localStorage.getItem('auth_token');
    function authHeaders() {
      const h = { 'Content-Type': 'application/json' };
      if (authToken) h['Authorization'] = `Bearer ${authToken}`;
      return h;
    }
    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }

    const REPORT_URL = '/api/contacts/report/phone-list-by-state';
    const NOWRAP_COLS = new Set(['store_id', 'phone', 'fax']);
    const MONO_COLS   = new Set(['phone', 'fax']);

    let COLUMNS = [];
    let ROWS = [];

    // Placeholder numbers (all one digit repeated, e.g. 111-111-1111) are
    // what gets entered for a store that doesn't have a line yet.
    function phoneNeedsAttention(v) {
      if (!v) return true;
      const d = String(v).replace(/\D/g, '');
      return d.length === 10 && /^(\d)\1{9}$/.test(d);
    }

    function renderTable() {
      const q        = (document.getElementById('search').value || '').trim().toLowerCase();
      const stateVal = document.getElementById('state-filter').value;
      const opVal    = document.getElementById('operator-filter').value;
      const flagOnly = document.getElementById('flag-only').checked;

      const filtered = ROWS.filter(r => {
        if (stateVal && (r.state || '') !== stateVal) return false;
        if (opVal && (r.operator || '') !== opVal) return false;
        if (flagOnly && !phoneNeedsAttention(r.phone)) return false;
        if (!q) return true;
        return COLUMNS.some(c => String(r[c.key] ?? '').toLowerCase().includes(q));
      });

      const states = new Set(filtered.map(r => r.state));
      document.getElementById('count').textContent =
        `${filtered.length} of ${ROWS.length} restaurants · ${states.size} state${states.size === 1 ? '' : 's'}`;

      if (!filtered.length) {
        document.getElementById('content').innerHTML =
          '<div class="state">No restaurants match these filters.</div>';
        return;
      }

      const thead = `<thead><tr>${COLUMNS.map(c =>
        `<th>${escapeHtml(c.label)}</th>`).join('')}</tr></thead>`;

      // SSRS-style grouping: the state name prints only on the first row of
      // each state, with a divider above the group.
      let prevState = null;
      const body = filtered.map(r => {
        const first = r.state !== prevState;
        prevState = r.state;
        const cells = COLUMNS.map(c => {
          const v = r[c.key];
          const empty = v === null || v === undefined || v === '';
          const cls = [];
          if (c.key === 'state') {
            cls.push('state-cell');
            return `<td class="${cls.join(' ')}">${first ? escapeHtml(v ?? '—') : ''}</td>`;
          }
          if (NOWRAP_COLS.has(c.key)) cls.push('nowrap');
          if (MONO_COLS.has(c.key)) cls.push('mono');
          if (c.key === 'phone' && phoneNeedsAttention(v)) cls.push('flag');
          else if (empty) cls.push('empty');
          let inner;
          if (empty) inner = c.key === 'phone' ? 'Missing' : '—';
          else if (c.key === 'store_name' && r.store_id != null)
            inner = `<a href="/contacts-store-detail.html?id=${encodeURIComponent(r.store_id)}">${escapeHtml(v)}</a>`;
          else inner = escapeHtml(v);
          if (c.key === 'store_name') cls.push('store-name');
          return `<td class="${cls.join(' ')}">${inner}</td>`;
        }).join('');
        return `<tr class="${first ? 'group-start' : ''}">${cells}</tr>`;
      }).join('');

      document.getElementById('content').innerHTML =
        `<div class="table-wrap"><table class="report">${thead}<tbody>${body}</tbody></table></div>`;
    }

    function populateFilters() {
      const uniq = (key) => [...new Set(ROWS.map(r => r[key]).filter(v => v))]
        .sort((a, b) => String(a).localeCompare(String(b)));
      const fill = (id, key) => {
        const sel = document.getElementById(id);
        uniq(key).forEach(v => {
          const o = document.createElement('option'); o.value = v; o.textContent = v; sel.appendChild(o);
        });
      };
      fill('state-filter', 'state');
      fill('operator-filter', 'operator');
    }

    async function downloadCsv() {
      const btn = document.getElementById('csv-btn');
      btn.disabled = true;
      try {
        const r = await fetch(`${REPORT_URL}?format=csv`, { headers: authHeaders() });
        if (!r.ok) throw new Error(await r.text());
        const blob = await r.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'restaurant_phone_list_by_state.csv';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      } catch (e) {
        alert('CSV download failed: ' + e.message);
      } finally {
        btn.disabled = false;
      }
    }

    async function boot() {
      try {
        const r = await fetch(REPORT_URL, { headers: authHeaders() });
        if (r.status === 401) {
          document.getElementById('content').innerHTML =
            '<div class="state error">Sign in required. <a href="/">Sign in</a> to view the report.</div>';
          return;
        }
        if (!r.ok) throw new Error(await r.text());
        const data = await r.json();
        COLUMNS = data.columns || [];
        ROWS = data.rows || [];
        document.getElementById('subtitle').textContent =
          `Open restaurants — from the in-app contacts database · Run date: ${new Date().toLocaleString()}`;
        if (!ROWS.length) {
          document.getElementById('content').innerHTML =
            '<div class="state">No open restaurants found in the contacts database yet.</div>';
          return;
        }
        document.getElementById('toolbar').style.display = '';
        populateFilters();
        renderTable();
        document.getElementById('search').addEventListener('input', renderTable);
        document.getElementById('state-filter').addEventListener('change', renderTable);
        document.getElementById('operator-filter').addEventListener('change', renderTable);
        document.getElementById('flag-only').addEventListener('change', renderTable);
      } catch (e) {
        document.getElementById('content').innerHTML =
          `<div class="state error">Couldn't load the report: ${escapeHtml(e.message)}</div>`;
      }
    }

    document.getElementById('csv-btn').addEventListener('click', downloadCsv);
    document.getElementById('print-btn').addEventListener('click', () => window.print());
    boot();
  </script>
</body>
</html>
