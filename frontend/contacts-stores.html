<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Stores - Newk's Reporting Platform</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      margin: 0; padding: 0; background: #F8FAFC; color: #2c2c2c;
    }
    .header {
      background: #C41E3A; padding: 1.5rem 2rem;
      border-bottom: 3px solid #A01A2E;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .header-content { display: flex; justify-content: space-between; align-items: center; }
    .header h1 { margin: 0; color: #fff; font-size: 1.75rem; font-weight: 700; }
    .header p  { margin: 0.4rem 0 0; color: rgba(255,255,255,0.9); font-size: 0.9rem; }
    .nav-btns { display: flex; gap: 0.5rem; }
    .nav-btn {
      background: rgba(255,255,255,0.15); color: #fff;
      border: 1px solid rgba(255,255,255,0.3);
      padding: 0.5rem 1rem; border-radius: 6px;
      font-size: 0.9rem; cursor: pointer; text-decoration: none;
    }
    .nav-btn:hover { background: rgba(255,255,255,0.25); }

    main { padding: 1.5rem 2rem; max-width: 1500px; margin: 0 auto; }

    .toolbar {
      display: flex; justify-content: space-between; align-items: center;
      gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap;
    }
    .toolbar-left {
      display: flex; align-items: center; gap: 0.6rem; flex: 1; min-width: 240px;
    }
    .toolbar-left input[type="text"] {
      flex: 1; padding: 0.55rem 0.75rem;
      border: 1px solid #D1D5DB; border-radius: 6px; font-size: 0.95rem;
    }
    .filter-pill {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.4rem 0.7rem; border: 1px solid #D1D5DB;
      border-radius: 6px; background: #fff; font-size: 0.85rem;
      cursor: pointer; user-select: none;
    }
    .filter-pill input { margin: 0; }
    .count { color: #6B7280; font-size: 0.85rem; }

    .btn {
      padding: 0.55rem 1rem; border-radius: 6px; font-size: 0.9rem;
      cursor: pointer; border: none; font-weight: 600;
    }
    .btn-primary { background: #C41E3A; color: #fff; }
    .btn-primary:hover { background: #A01A2E; }
    .btn-secondary { background: #fff; color: #374151; border: 1px solid #D1D5DB; }
    .btn-secondary:hover { background: #F3F4F6; }
    .btn-danger { background: #DC2626; color: #fff; }
    .btn-danger:hover { background: #B91C1C; }
    .btn[disabled] { opacity: 0.5; cursor: not-allowed; }

    table {
      width: 100%; border-collapse: collapse;
      background: #fff; border: 1px solid #E5E7EB;
      border-radius: 8px; overflow: hidden; font-size: 0.88rem;
    }
    thead { background: #F9FAFB; }
    th {
      text-align: left; padding: 0.7rem 0.85rem;
      font-weight: 600; color: #374151;
      border-bottom: 2px solid #E5E7EB;
      cursor: pointer; user-select: none; white-space: nowrap;
    }
    th:hover { background: #F3F4F6; }
    th .sort-indicator { color: #C41E3A; font-size: 0.7rem; margin-left: 0.25rem; }
    td {
      padding: 0.55rem 0.85rem;
      border-bottom: 1px solid #F3F4F6;
      vertical-align: top; white-space: nowrap;
    }
    tr.row { cursor: pointer; }
    tr.row:hover { background: #FEF2F2; }
    tr.row:last-child td { border-bottom: 0; }
    .view-link {
      display: inline-block;
      padding: 0.25rem 0.55rem;
      font-size: 0.8rem;
      color: #1E3A5F;
      background: #F3F4F6;
      border: 1px solid #E5E7EB;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      white-space: nowrap;
    }
    .view-link:hover { background: #E5EDF6; border-color: #C7D2DE; }
    td.row-actions { text-align: right; }
    .empty {
      padding: 2rem; text-align: center; color: #9CA3AF; font-style: italic;
    }
    .loading { color: #6B7280; padding: 2rem; text-align: center; }
    .error {
      background: #FEE2E2; color: #991B1B;
      padding: 0.75rem 1rem; border-radius: 6px;
      margin-bottom: 1rem; border: 1px solid #FECACA;
    }
    .info {
      background: #DBEAFE; color: #1E40AF;
      padding: 0.75rem 1rem; border-radius: 6px;
      margin-bottom: 1rem; border: 1px solid #BFDBFE;
    }
    .status-badge {
      display: inline-block; padding: 0.15rem 0.55rem;
      border-radius: 10px; font-size: 0.75rem; font-weight: 600;
    }
    .status-open    { background: #DCFCE7; color: #166534; }
    .status-closed  { background: #FEE2E2; color: #991B1B; }
    .status-unknown { background: #F3F4F6; color: #6B7280; }

    /* Ownership — Company-owned vs Franchisee */
    .own-badge {
      display: inline-block; padding: 0.15rem 0.55rem;
      border-radius: 10px; font-size: 0.75rem; font-weight: 600;
      white-space: nowrap;
    }
    .own-company   { background: #DBEAFE; color: #1E40AF; }
    .own-franchise { background: #FEF3C7; color: #92400E; }
    .own-unknown   { background: #F3F4F6; color: #6B7280; }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      display: none; align-items: center; justify-content: center;
      z-index: 1000;
    }
    .modal-overlay.visible { display: flex; }
    .modal {
      background: #fff; border-radius: 10px;
      width: 760px; max-width: 95%; max-height: 92vh;
      overflow-y: auto;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }
    .modal-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid #E5E7EB;
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; background: #fff; z-index: 1;
    }
    .modal-header h2 { margin: 0; color: #1E3A5F; font-size: 1.2rem; }
    .modal-close {
      background: none; border: none; font-size: 1.5rem;
      color: #9CA3AF; cursor: pointer; padding: 0; line-height: 1;
    }
    .modal-body { padding: 1.25rem 1.5rem; }
    .modal-footer {
      padding: 1rem 1.5rem; border-top: 1px solid #E5E7EB;
      display: flex; justify-content: flex-end; gap: 0.5rem;
      position: sticky; bottom: 0; background: #fff;
    }
    .section-title {
      font-size: 0.78rem;
      color: #C41E3A;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 700;
      margin: 1.25rem 0 0.5rem;
      border-bottom: 1px solid #FEE2E2;
      padding-bottom: 0.25rem;
    }
    .section-title:first-child { margin-top: 0.25rem; }
    .form-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 0.5rem 1rem;
    }
    .form-row.span-2 { grid-column: 1 / -1; }
    .form-row { margin-bottom: 0.6rem; }
    .form-row label {
      display: block; font-size: 0.78rem; font-weight: 600;
      color: #374151; margin-bottom: 0.15rem;
    }
    .form-row input, .form-row select, .form-row textarea {
      width: 100%; padding: 0.4rem 0.6rem;
      border: 1px solid #D1D5DB; border-radius: 6px;
      font-size: 0.88rem; background: #fff;
    }
    .form-row input:focus, .form-row select:focus, .form-row textarea:focus {
      outline: none; border-color: #C41E3A;
      box-shadow: 0 0 0 2px rgba(196,30,58,0.1);
    }
    .form-row.readonly input { background: #F9FAFB; color: #6B7280; }
    .form-row input[type="checkbox"] { width: auto; margin-right: 0.5rem; }
    .form-row .help {
      display: block; font-size: 0.72rem; color: #9CA3AF; margin-top: 0.15rem;
    }
    .auth-note {
      background: #FEF3C7; color: #92400E;
      font-size: 0.82rem; padding: 0.5rem 0.75rem;
      border-radius: 6px; margin-bottom: 1rem;
      border: 1px solid #FDE68A;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-content">
      <div>
        <h1>Stores</h1>
        <p>Store master directory (replaces forms.nfc.local/contacts/development/physical)</p>
      </div>
      <div class="nav-btns">
        <a href="/contacts.html" class="nav-btn">← Contacts</a>
        <a href="/" class="nav-btn">Home</a>
      </div>
    </div>
  </div>

  <main>
    <div id="messages"></div>

    <div class="toolbar">
      <div class="toolbar-left">
        <input type="text" id="search" placeholder="Search by ID, name, city, state…" />
        <label class="filter-pill">
          <input type="checkbox" id="active-only" checked />
          Active only
        </label>
        <span class="count" id="count">—</span>
      </div>
      <button id="add-btn" class="btn btn-primary">+ Add Store</button>
    </div>

    <div id="table-wrap">
      <div class="loading">Loading stores…</div>
    </div>
  </main>

  <!-- Edit / Add modal -->
  <div id="modal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">Edit Store</h2>
        <button class="modal-close" id="modal-close">×</button>
      </div>
      <div class="modal-body">
        <div id="modal-auth-note" class="auth-note" style="display:none;">
          You're not logged in as an admin — viewing only. Sign in as an admin to edit.
        </div>
        <div id="form-container"><!-- generated by JS --></div>
      </div>
      <div class="modal-footer">
        <button id="cancel-btn" class="btn btn-secondary">Cancel</button>
        <button id="save-btn" class="btn btn-primary">Save</button>
      </div>
    </div>
  </div>

  <script>
    // ──────────────────────────────────────────────────────────────────────────
    // Field configuration — groups + types for the edit modal
    //   col    = SQLite column name (must match exactly)
    //   label  = pretty label for the form
    //   type   = text | number | date | checkbox | textarea | lookup
    //   lookup = (when type='lookup') one of the LOOKUP names below; the form
    //            fetches /api/contacts/lookups/{name} → [{id, label}] and
    //            renders a <select>. Empty option = NULL.
    //   help   = optional help text under the input
    //   span   = '2' to span both grid columns; default 1
    //   ro     = readonly (auto-managed fields like StoreID + audit)
    // ──────────────────────────────────────────────────────────────────────────
    const STORE_SECTIONS = [
      { title: 'Identity', fields: [
        { col: 'StoreID',       label: 'Store ID',    type: 'number', ro: true,
          help: 'Newk\'s internal ID (e.g. 1042). Can\'t be changed.' },
        { col: 'StoreName',     label: 'Store Name',  type: 'text' },
        { col: 'StoreTagline',  label: 'Tagline',     type: 'text', span: 2 },
        // OLO Vendor ID is app-owned (StoreOLOVendor table), NOT a Store column.
        // It's saved via its own endpoint in onSave(); readForm() pulls it out
        // of the store payload so the Store PUT never sees it. See OLO_VENDOR_COL.
        { col: 'OLOVendorID',   label: 'OLO Vendor ID', type: 'text',
          help: 'Static per-store OLO identifier (e.g. 33030). Replaces the retired SQL Server OLO feed.' },
      ]},
      { title: 'Address', fields: [
        { col: 'StoreAdd1', label: 'Address Line 1', type: 'text', span: 2 },
        { col: 'StoreAdd2', label: 'Address Line 2', type: 'text', span: 2 },
        { col: 'StoreAdd3', label: 'Address Line 3', type: 'text', span: 2 },
        { col: 'StoreCity', label: 'City', type: 'text' },
        { col: 'StoreState', label: 'State', type: 'text' },
        { col: 'StoreZip', label: 'Zip', type: 'number' },
        { col: 'StoreCountry', label: 'Country', type: 'text' },
        { col: 'StoreCountryCode', label: 'Country Code', type: 'text' },
        { col: 'StoreCrossStreet', label: 'Cross Street', type: 'text', span: 2 },
        { col: 'StoreLatitude', label: 'Latitude', type: 'number' },
        { col: 'StoreLongitude', label: 'Longitude', type: 'number' },
      ]},
      { title: 'Contact', fields: [
        { col: 'StorePhone', label: 'Phone', type: 'text' },
        { col: 'StoreFax', label: 'Fax', type: 'text' },
        { col: 'StoreEmail', label: 'Email', type: 'text', span: 2 },
        { col: 'StoreEmail2', label: 'Secondary Email', type: 'text', span: 2 },
        { col: 'StoreExtraEmails', label: 'Extra Emails', type: 'text', span: 2,
          help: 'Semicolon-separated for distribution lists' },
        { col: 'StoreCateringEmail', label: 'Catering Email', type: 'text' },
        { col: 'StoreCateringPhone', label: 'Catering Phone', type: 'text' },
        { col: 'StoreFirstName', label: 'Manager First Name', type: 'text' },
        { col: 'StoreLastName', label: 'Manager Last Name', type: 'text' },
      ]},
      { title: 'Status & Dates', fields: [
        { col: 'StoreStatus', label: 'Status', type: 'text' },
        { col: 'StoreStatusDesc', label: 'Status Description', type: 'text' },
        { col: 'StoreOpenDate', label: 'Open Date', type: 'date' },
        { col: 'StoreCloseDate', label: 'Close Date', type: 'date' },
        { col: 'RefreshCloseDate', label: 'Refresh Close Date', type: 'date' },
        { col: 'RefreshReOpenDate', label: 'Refresh Re-Open Date', type: 'date' },
        { col: 'OwnershipChangeDate', label: 'Ownership Change Date', type: 'date' },
        { col: 'ToastLive', label: 'Toast Go-Live Date', type: 'date' },
        { col: 'MonkeyLiveDate', label: 'Monkey Media Go-Live', type: 'date' },
        { col: 'IsMonkeyStore', label: 'Monkey Store', type: 'checkbox' },
        { col: 'StoreIsComping', label: 'Comping Store', type: 'checkbox' },
        { col: 'ActiveCrunchtime', label: 'Active on CrunchTime', type: 'checkbox' },
      ]},
      { title: 'Operations', fields: [
        { col: 'StoreAlcFlag', label: 'Sells Alcohol', type: 'checkbox' },
        { col: 'StoreMenuBoardType', label: 'Menu Board Type ID', type: 'number',
          help: 'No lookup table yet — leave as numeric ID.' },
        { col: 'OLOLink', label: 'OLO Link', type: 'text', span: 2 },
        { col: 'CateringOLOLink', label: 'Catering OLO Link', type: 'text', span: 2 },
        { col: 'CateringMenuURL', label: 'Catering Menu URL', type: 'text', span: 2 },
        { col: 'StoreCareers', label: 'Careers URL', type: 'text', span: 2 },
        { col: 'StoreHoursOfOperation', label: 'Hours of Operation', type: 'textarea', span: 2 },
      ]},
      { title: 'Leadership & FKs', fields: [
        { col: 'StoreCompany',        label: 'Company',          type: 'lookup', lookup: 'company' },
        { col: 'StoreAreaDirID',      label: 'Area Director',    type: 'lookup', lookup: 'areadir' },
        { col: 'StoreFMMID',          label: 'FMM',              type: 'lookup', lookup: 'fmm' },
        { col: 'StoreFBCID',          label: 'FBC',              type: 'lookup', lookup: 'fbc' },
        { col: 'StoreDMAID',          label: 'DMA',              type: 'lookup', lookup: 'dma' },
        { col: 'StoreOwnershipID',    label: 'Ownership',        type: 'lookup', lookup: 'ownership' },
        { col: 'StoreCateringMgrID',  label: 'Catering Manager', type: 'lookup', lookup: 'cateringmgr' },
        { col: 'StorePrimaryContact', label: 'Primary Contact',  type: 'lookup', lookup: 'primarycontact' },
        { col: 'StoreBillingID',      label: 'Billing Contact',  type: 'lookup', lookup: 'billing' },
        { col: 'StoreSyscoID',        label: 'Sysco Market',     type: 'lookup', lookup: 'sysco' },
        // These IDs have no lookup table yet — leave numeric.
        { col: 'StoreRegionID',   label: 'Region ID',   type: 'text' },
        { col: 'StoreSystemID',   label: 'System ID',   type: 'number' },
        { col: 'StoreDistrictID', label: 'District ID', type: 'number' },
        { col: 'StoreDivisionID', label: 'Division ID', type: 'number' },
      ]},
      { title: 'External Systems', fields: [
        { col: 'StoreCFID', label: 'Catering Forms ID', type: 'text' },
        { col: 'StoreCFPW', label: 'Catering Forms Password', type: 'text' },
        { col: 'POSSoftwareKeyID', label: 'POS Software Key', type: 'text' },
        { col: 'KnappGeo', label: 'Knapp Geography ID', type: 'number' },
      ]},
      { title: 'Audit', fields: [
        { col: 'LastUpdatedBy', label: 'Last Updated By', type: 'text', ro: true },
        { col: 'LastUpdated', label: 'Last Updated At', type: 'text', ro: true },
      ]},
    ];

    // ──────────────────────────────────────────────────────────────────────────
    // Satellite tables — StorePhysical (1:1), StoreTechnical (1:1).
    //
    // These render as additional sections in the modal and save via
    // /api/contacts/stores/{id}/physical and /technical respectively.
    // The exporter brings the full SQL Server column list down, but here
    // we only surface the columns we want as first-class form fields.
    // Anything in the SQLite row that isn't listed here passes through
    // untouched on save (we only PUT the fields that appear in the form).
    // ──────────────────────────────────────────────────────────────────────────
    // Real StorePhysical columns (13). Note: audit cols are LastEdited /
    // LastEditedBy (Don's older naming), handled server-side.
    const STORE_PHYSICAL_FIELDS = [
      { col: 'SquareFeet',       label: 'Square Feet',        type: 'number' },
      { col: 'TypeOfBuilding',   label: 'Type of Building',   type: 'text' },
      { col: 'Classification',   label: 'Classification',     type: 'text' },
      { col: 'IndoorSeats',      label: 'Indoor Seats',       type: 'number' },
      { col: 'ExteriorSeats',    label: 'Exterior Seats',     type: 'number' },
      { col: 'NumPOSTerms',      label: 'POS Terminals',      type: 'number',
        help: 'StorePhysical also tracks this (originally-installed count).' },
      { col: 'NumParkingSpots',  label: 'Parking Spots',      type: 'number' },
      { col: 'DriveThru',        label: 'Drive-Thru',         type: 'text',
        help: 'Yes / No / partial — free-text in SQL Server.' },
      { col: 'CoolerLocation',   label: 'Cooler Location',    type: 'text' },
      { col: 'GNGCoolerSize',    label: 'Grab-N-Go Cooler Size', type: 'number' },
    ];

    // Real StoreTechnical columns (47). Grouped by topic via the order
    // below; the form renders one big grid so the comments are just for
    // future maintainers. FK columns ending in *ID are kept as numeric
    // inputs for now — once we export FireWallProvider / PhoneVendors /
    // CameraVendors / AVSoftwareType / KioskType / POSType / HSIServiceType
    // we can convert them to dropdowns.
    const STORE_TECHNICAL_FIELDS = [
      // POS — Aloha + Toast
      { col: 'POSKey',                label: 'POS Key #',              type: 'number' },
      { col: 'fkPOSTypeID',           label: 'POS Type',               type: 'lookup', lookup: 'postype' },
      { col: 'AlohaVersion',          label: 'Aloha Version',          type: 'text' },
      { col: 'EDCVersion',            label: 'EDC Version',            type: 'text' },
      { col: 'ATOVersion',            label: 'ATO Version',            type: 'text' },
      { col: 'CMCVersion',            label: 'CMC Version',            type: 'text' },
      { col: 'CFCVersion',            label: 'CFC Version',            type: 'text' },
      { col: 'SVVersion',             label: 'SV Version',             type: 'text' },
      { col: 'WarezLastUpdated',      label: 'Software Last Updated',  type: 'date' },
      { col: 'NumPOSTerms',           label: 'POS Terminals (Current)', type: 'number' },
      { col: 'ToastPOSVersion',       label: 'Toast POS Version',      type: 'text' },
      { col: 'ToastPayVersion',       label: 'Toast Pay Version',      type: 'text' },
      { col: 'ToastKDSCount',         label: 'Toast KDS Count',        type: 'number' },
      { col: 'ToastHandHeldCount',    label: 'Toast Handheld Count',   type: 'number' },
      { col: 'PrinterCount',          label: 'Printer Count',          type: 'number' },
      // Network
      { col: 'ExternalIP',            label: 'External IP',            type: 'text' },
      { col: 'MgmtIP',                label: 'Management IP',          type: 'text' },
      { col: 'StaticIPCount',         label: 'Static IP Count',        type: 'number' },
      { col: 'Bandwidth',             label: 'Bandwidth',              type: 'text' },
      { col: 'ISPName',               label: 'ISP Name',               type: 'text' },
      { col: 'FKHSIServiceType',      label: 'HSI Service Type',       type: 'lookup', lookup: 'hsiservicetype' },
      { col: 'ManagedSwitch',         label: 'Managed Switch',         type: 'text' },
      { col: 'Failover',              label: 'Failover',               type: 'text' },
      { col: 'AccessPoint',           label: 'Access Point',           type: 'text' },
      { col: 'FireWallProvider',      label: 'Firewall Provider',     type: 'lookup', lookup: 'firewall' },
      // Vendors
      { col: 'PhoneVendorID',         label: 'Phone Vendor',           type: 'lookup', lookup: 'phonevendor' },
      { col: 'OtherPhoneVendor',      label: 'Other Phone Vendor',     type: 'text' },
      { col: 'CameraVendorID',        label: 'Camera Vendor',          type: 'lookup', lookup: 'cameravendor' },
      // A/V Software
      { col: 'AVSoftwareTypeID',      label: 'A/V Software Type',      type: 'lookup', lookup: 'avsoftwaretype' },
      { col: 'OtherAVSoftware',       label: 'Other A/V Software',     type: 'text' },
      { col: 'AVSoftwareVersion',     label: 'A/V Software Version',   type: 'text' },
      { col: 'AVSoftwareInstallDate', label: 'A/V Install Date',       type: 'date' },
      { col: 'AVSoftwareExpirationDate', label: 'A/V Expiration Date', type: 'date' },
      // Kiosks
      { col: 'fkKioskTypeID',         label: 'Kiosk Type',             type: 'lookup', lookup: 'kiosktype' },
      { col: 'NumKiosks',             label: 'Number of Kiosks',       type: 'number' },
      // Credit-card processors — stored as 0/1 flags in SQL Server
      { col: 'CCProcessorInHouse',    label: 'CC Processor: In-House', type: 'checkbox' },
      { col: 'CCProcessorOLO',        label: 'CC Processor: OLO',      type: 'checkbox' },
      { col: 'CCProcessorMM',         label: 'CC Processor: Monkey Media', type: 'checkbox' },
      { col: 'CCProcessorAmexDirect', label: 'CC Processor: Amex Direct',  type: 'checkbox' },
      // Misc
      { col: 'Oven',                  label: 'Oven',                   type: 'text' },
      { col: 'TimeZone',              label: 'Time Zone (offset)',     type: 'number' },
      { col: 'DST',                   label: 'Observes Daylight Savings', type: 'checkbox' },
      { col: 'KEA',                   label: 'KEA',                    type: 'checkbox',
        help: 'Kitchen Equipment Alert flag (legacy).' },
    ];

    // ──────────────────────────────────────────────────────────────────────────
    // Loaded once at page init; cache populated by loadAllLookups().
    // Shape: { 'company': [{id, label}, ...], ... }
    // ──────────────────────────────────────────────────────────────────────────
    const LOOKUP_CACHE = {};
    // Track satellite payloads + closure history for the currently-open store.
    let modalContext = { storeId: null, physical: {}, technical: {}, closures: [], delivery_partners: [] };

    // ──────────────────────────────────────────────────────────────────────────
    // Auth state
    // ──────────────────────────────────────────────────────────────────────────
    const authToken = localStorage.getItem('auth_token');
    let currentUser = null;
    try { currentUser = JSON.parse(localStorage.getItem('user') || 'null'); } catch {}
    const isAdmin = currentUser && currentUser.role === 'admin';

    function authHeaders() {
      const h = { 'Content-Type': 'application/json' };
      if (authToken) h['Authorization'] = `Bearer ${authToken}`;
      return h;
    }

    // ──────────────────────────────────────────────────────────────────────────
    // State
    // ──────────────────────────────────────────────────────────────────────────
    let allRows = [];
    let sortCol = 'StoreID';
    let sortDir = 1;

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }
    function showError(msg) {
      const el = document.getElementById('messages');
      el.innerHTML = `<div class="error">${escapeHtml(msg)}</div>`;
      setTimeout(() => { el.innerHTML = ''; }, 6000);
    }
    function showInfo(msg) {
      const el = document.getElementById('messages');
      el.innerHTML = `<div class="info">${escapeHtml(msg)}</div>`;
      setTimeout(() => { el.innerHTML = ''; }, 4000);
    }

    function isActive(row) {
      // "Active" = no close date set, OR close date in the future,
      // OR status indicates open. Helps hide retired/closed stores by default.
      if (row.StoreCloseDate) {
        const d = new Date(row.StoreCloseDate);
        if (!isNaN(d) && d <= new Date()) return false;
      }
      const status = (row.StoreStatus || '').toLowerCase();
      if (status.includes('closed') || status.includes('retire')) return false;
      return true;
    }

    // ──────────────────────────────────────────────────────────────────────────
    // Data
    // ──────────────────────────────────────────────────────────────────────────
    async function loadList() {
      const wrap = document.getElementById('table-wrap');
      wrap.innerHTML = '<div class="loading">Loading stores…</div>';
      try {
        const r = await fetch('/api/contacts/stores', { headers: authHeaders() });
        if (r.status === 401) {
          wrap.innerHTML = '<div class="error">You need to be logged in. <a href="/">Sign in</a> first.</div>';
          return;
        }
        if (!r.ok) {
          const txt = await r.text();
          wrap.innerHTML = `<div class="error">Failed to load: ${escapeHtml(txt)}</div>`;
          return;
        }
        allRows = await r.json();
        render();
        // Honor #edit-<storeId> in the URL — lets the read-only detail
        // page link back here with the edit modal pre-opened so the user
        // doesn't have to re-find the store in the list.
        const m = (window.location.hash || '').match(/^#edit-(\d+)/);
        if (m) {
          const id = parseInt(m[1], 10);
          if (allRows.some(r => r.StoreID === id)) {
            openEditModal(id);
          }
        }
      } catch (e) {
        wrap.innerHTML = `<div class="error">Network error: ${escapeHtml(e.message)}</div>`;
      }
    }

    function render() {
      const q = document.getElementById('search').value.trim().toLowerCase();
      const activeOnly = document.getElementById('active-only').checked;

      let rows = allRows.filter(r => {
        if (activeOnly && !isActive(r)) return false;
        if (!q) return true;
        const blob = [
          r.StoreID, r.StoreName, r.StoreCity, r.StoreState,
          r.StoreStatus, r.StoreAdd1,
          // Ownership is searchable too — typing "franchise" / "company"
          // (or a franchisee entity name) filters the list.
          ownershipLabel(r), r.OwnershipEntity
        ].filter(v => v != null).join(' ').toLowerCase();
        return blob.includes(q);
      });

      rows.sort((a, b) => {
        const av = a[sortCol], bv = b[sortCol];
        const an = (av === null || av === undefined || av === '');
        const bn = (bv === null || bv === undefined || bv === '');
        if (an && bn) return 0;
        if (an) return 1;
        if (bn) return -1;
        const aS = typeof av === 'number' ? av : av.toString().toLowerCase();
        const bS = typeof bv === 'number' ? bv : bv.toString().toLowerCase();
        if (aS < bS) return -1 * sortDir;
        if (aS > bS) return  1 * sortDir;
        return 0;
      });

      document.getElementById('count').textContent =
        `${rows.length}${rows.length !== allRows.length ? ' of ' + allRows.length : ''}`;

      const wrap = document.getElementById('table-wrap');
      if (rows.length === 0) {
        wrap.innerHTML = `<div class="empty">${
          allRows.length === 0
            ? 'No stores in SQLite yet. Run contacts_export_from_sqlserver.py to import.'
            : 'No matches for your search/filter.'
        }</div>`;
        return;
      }

      const headers = [
        ['StoreID',       '#'],
        ['StoreName',     'Store'],
        ['StoreCity',     'City'],
        ['StoreState',    'State'],
        ['OwnershipType', 'Owner'],
        ['StoreStatus',   'Status'],
        ['StoreOpenDate', 'Open'],
        ['LastUpdatedBy', 'Last Edited By'],
        ['LastUpdated',   'When'],
        ['',              ''],   // actions column — no sort
      ];

      let html = '<table><thead><tr>';
      headers.forEach(([col, label]) => {
        if (!col) { html += '<th></th>'; return; }
        const ind = (sortCol === col) ? `<span class="sort-indicator">${sortDir>0?'▲':'▼'}</span>` : '';
        html += `<th data-col="${col}">${label}${ind}</th>`;
      });
      html += '</tr></thead><tbody>';
      rows.forEach(r => {
        const lastWhen = r.LastUpdated
          ? new Date(r.LastUpdated).toLocaleDateString()
          : '';
        const statusBadge = statusBadgeHtml(r);
        // View link goes to the read-only profile page. Row click (anywhere
        // else) still opens the edit modal — admins use it as the primary
        // workflow; the View link is for non-admins or quick scans.
        const viewBtn = `<a class="view-link" href="/contacts-store-detail.html?id=${escapeHtml(r.StoreID)}" title="Open profile view" onclick="event.stopPropagation();">View →</a>`;
        html += `<tr class="row" data-id="${r.StoreID}">
          <td>${escapeHtml(r.StoreID ?? '')}</td>
          <td><strong>${escapeHtml(r.StoreName ?? '')}</strong></td>
          <td>${escapeHtml(r.StoreCity ?? '')}</td>
          <td>${escapeHtml(r.StoreState ?? '')}</td>
          <td>${ownershipBadgeHtml(r)}</td>
          <td>${statusBadge}</td>
          <td>${escapeHtml(r.StoreOpenDate ?? '')}</td>
          <td>${escapeHtml(r.LastUpdatedBy ?? '')}</td>
          <td>${escapeHtml(lastWhen)}</td>
          <td class="row-actions">${viewBtn}</td>
        </tr>`;
      });
      html += '</tbody></table>';
      wrap.innerHTML = html;

      wrap.querySelectorAll('tr.row').forEach(tr => {
        tr.addEventListener('click', () => openEditModal(parseInt(tr.dataset.id, 10)));
      });
      wrap.querySelectorAll('th[data-col]').forEach(th => {
        th.addEventListener('click', () => {
          const col = th.dataset.col;
          if (sortCol === col) sortDir *= -1;
          else { sortCol = col; sortDir = 1; }
          render();
        });
      });
    }

    // Ownership comes from the backend already resolved (contacts Company /
    // OwnerShip lookups, then store_ownership.json) — see
    // contacts_db.resolve_store_ownership. Null = we genuinely don't know,
    // which shows as "—" rather than guessing the store into a bucket.
    function ownershipLabel(row) {
      const t = row.OwnershipType;
      if (t === 'Company')   return 'Company';
      if (t === 'Franchise') return 'Franchisee';
      return '';
    }

    function ownershipBadgeHtml(row) {
      const label = ownershipLabel(row);
      if (!label) {
        return '<span class="own-badge own-unknown" title="Ownership not set in contacts or store_ownership.json">—</span>';
      }
      const cls = row.OwnershipType === 'Company' ? 'own-company' : 'own-franchise';
      const entity = row.OwnershipEntity ? ` title="${escapeHtml(row.OwnershipEntity)}"` : '';
      return `<span class="own-badge ${cls}"${entity}>${label}</span>`;
    }

    function statusBadgeHtml(row) {
      const active = isActive(row);
      const label = row.StoreStatus || (active ? 'Open' : 'Closed');
      const cls = active ? 'status-open' : 'status-closed';
      return `<span class="status-badge ${cls}">${escapeHtml(label)}</span>`;
    }

    // ──────────────────────────────────────────────────────────────────────────
    // Modal — generate form from STORE_SECTIONS + satellite configs.
    // Each field's id is prefixed with the section group ('store_', 'phys_',
    // 'tech_') so readForm() can route values to the right backend endpoint.
    // ──────────────────────────────────────────────────────────────────────────
    function renderFieldHtml(f, idPrefix) {
      const id = `${idPrefix}_${f.col}`;
      const spanCls = f.span === 2 ? ' span-2' : '';
      const roCls = f.ro ? ' readonly' : '';
      let html = `<div class="form-row${spanCls}${roCls}">`;
      html += `<label for="${id}">${f.label}</label>`;
      if (f.type === 'checkbox') {
        html += `<input type="checkbox" id="${id}" data-col="${f.col}" data-group="${idPrefix}" />`;
      } else if (f.type === 'textarea') {
        html += `<textarea id="${id}" data-col="${f.col}" data-group="${idPrefix}" rows="2"${f.ro?' readonly':''}></textarea>`;
      } else if (f.type === 'lookup') {
        // Options are filled in by populateLookupOptions() once the cache
        // is loaded. Until then the select is just an empty <option>.
        html += `<select id="${id}" data-col="${f.col}" data-group="${idPrefix}" data-lookup="${f.lookup}"${f.ro?' disabled':''}>`;
        html += `<option value="">— none —</option>`;
        html += `</select>`;
      } else {
        const t = f.type || 'text';
        html += `<input type="${t}" id="${id}" data-col="${f.col}" data-group="${idPrefix}"${f.ro?' readonly':''} />`;
      }
      if (f.help) html += `<span class="help">${f.help}</span>`;
      html += '</div>';
      return html;
    }

    function renderForm() {
      const c = document.getElementById('form-container');
      let html = '';

      // Base Store sections
      STORE_SECTIONS.forEach(sec => {
        html += `<div class="section-title">${sec.title}</div>`;
        html += '<div class="form-grid">';
        sec.fields.forEach(f => { html += renderFieldHtml(f, 'store'); });
        html += '</div>';
      });

      // StorePhysical satellite (1:1)
      html += '<div class="section-title">Physical (Square Footage, Seats, Drive-Thru)</div>';
      html += '<div class="form-grid">';
      STORE_PHYSICAL_FIELDS.forEach(f => { html += renderFieldHtml(f, 'phys'); });
      html += '</div>';

      // StoreTechnical satellite (1:1)
      html += '<div class="section-title">Technical (POS, Network, Vendors)</div>';
      html += '<div class="form-grid">';
      STORE_TECHNICAL_FIELDS.forEach(f => { html += renderFieldHtml(f, 'tech'); });
      html += '</div>';

      // StoreClosure history — read-only count + last few entries
      html += '<div class="section-title">Closure History (read-only)</div>';
      html += '<div id="closure-history"><em style="color:#6B7280;font-size:0.85rem;">No closure history loaded.</em></div>';

      // DeliveryPartnersByStore — read-only list of partners for this store
      html += '<div class="section-title">Delivery Partners (read-only)</div>';
      html += '<div id="delivery-partners"><em style="color:#6B7280;font-size:0.85rem;">No delivery partners loaded.</em></div>';

      c.innerHTML = html;
      populateLookupOptions();
    }

    // ──────────────────────────────────────────────────────────────────────────
    // Lookups — fetch all FK dropdown data on page load.
    // Caches in LOOKUP_CACHE so opening the modal doesn't re-fetch every time.
    // ──────────────────────────────────────────────────────────────────────────
    async function loadAllLookups() {
      // Gather every distinct lookup name across all sections — base Store
      // sections plus the StorePhysical / StoreTechnical satellite configs.
      const names = new Set();
      const addFrom = arr => arr.forEach(f => {
        if (f.type === 'lookup' && f.lookup) names.add(f.lookup);
      });
      STORE_SECTIONS.forEach(sec => addFrom(sec.fields));
      addFrom(STORE_PHYSICAL_FIELDS);
      addFrom(STORE_TECHNICAL_FIELDS);
      await Promise.all(Array.from(names).map(async name => {
        try {
          const r = await fetch(`/api/contacts/lookups/${name}`, { headers: authHeaders() });
          if (!r.ok) { LOOKUP_CACHE[name] = []; return; }
          LOOKUP_CACHE[name] = await r.json();
        } catch (e) {
          console.warn(`Lookup '${name}' failed:`, e);
          LOOKUP_CACHE[name] = [];
        }
      }));
    }

    function populateLookupOptions() {
      // Fill <select data-lookup="…"> elements with cached options.
      // Called after renderForm() and after loadAllLookups() finishes.
      document.querySelectorAll('select[data-lookup]').forEach(sel => {
        const name = sel.dataset.lookup;
        const opts = LOOKUP_CACHE[name] || [];
        // Preserve the "— none —" first option, then append rows.
        const current = sel.value;
        sel.innerHTML = '<option value="">— none —</option>' +
          opts.map(o =>
            `<option value="${escapeHtml(o.id)}">${escapeHtml(o.label || '(unnamed)')} — ${escapeHtml(o.id)}</option>`
          ).join('');
        if (current) sel.value = current;  // restore selection after refresh
      });
    }

    function setEditableState() {
      document.getElementById('modal-auth-note').style.display = isAdmin ? 'none' : '';
      const c = document.getElementById('form-container');
      c.querySelectorAll('input, select, textarea').forEach(el => {
        // Don't override server-imposed readonly (audit fields)
        if (!el.hasAttribute('readonly')) el.disabled = !isAdmin;
      });
      document.getElementById('save-btn').style.display = isAdmin ? '' : 'none';
    }

    function clearFormFields() {
      const c = document.getElementById('form-container');
      c.querySelectorAll('input, textarea').forEach(el => {
        if (el.type === 'checkbox') el.checked = false;
        else el.value = '';
      });
      c.querySelectorAll('select').forEach(el => { el.value = ''; });
      document.getElementById('closure-history').innerHTML =
        '<em style="color:#6B7280;font-size:0.85rem;">No closure history (new store).</em>';
      document.getElementById('delivery-partners').innerHTML =
        '<em style="color:#6B7280;font-size:0.85rem;">No delivery partners (new store).</em>';
    }

    // Populate one set of fields from a row. group = 'store' | 'phys' | 'tech'.
    function populateGroup(fields, row, group) {
      fields.forEach(f => {
        const el = document.getElementById(`${group}_${f.col}`);
        if (!el) return;
        const v = row ? row[f.col] : null;
        if (f.type === 'checkbox') {
          el.checked = !!(v === 1 || v === true || v === '1' || v === 'true');
        } else if (f.type === 'date' && v) {
          el.value = String(v).slice(0, 10);
        } else {
          el.value = (v ?? '');
        }
      });
    }

    function openAddModal() {
      document.getElementById('modal-title').textContent = 'Add Store';
      clearFormFields();
      modalContext = { storeId: null, physical: {}, technical: {}, closures: [], delivery_partners: [] };
      // Allow editing StoreID since it's a new record
      const storeIdField = document.getElementById('store_StoreID');
      if (storeIdField) {
        storeIdField.readOnly = false;
        storeIdField.parentElement.classList.remove('readonly');
      }
      setEditableState();
      document.getElementById('modal').classList.add('visible');
    }

    async function openEditModal(id) {
      const row = allRows.find(r => r.StoreID === id);
      if (!row) return;
      document.getElementById('modal-title').textContent =
        `${isAdmin ? 'Edit' : 'View'}: ${row.StoreName || '#'+row.StoreID}`;

      // Keep StoreID readonly on edits
      const storeIdField = document.getElementById('store_StoreID');
      if (storeIdField) {
        storeIdField.readOnly = true;
        storeIdField.parentElement.classList.add('readonly');
      }

      // Populate base store from the list-cached row immediately for snappy UI…
      populateGroup(STORE_SECTIONS.flatMap(s => s.fields), row, 'store');
      // …blank satellites first to clear previous selection while /full loads.
      populateGroup(STORE_PHYSICAL_FIELDS,  null, 'phys');
      populateGroup(STORE_TECHNICAL_FIELDS, null, 'tech');
      document.getElementById('closure-history').innerHTML =
        '<em style="color:#6B7280;font-size:0.85rem;">Loading…</em>';
      document.getElementById('delivery-partners').innerHTML =
        '<em style="color:#6B7280;font-size:0.85rem;">Loading…</em>';
      setEditableState();
      document.getElementById('modal').classList.add('visible');

      // Fetch /full to hydrate satellites + closure history.
      try {
        const r = await fetch(`/api/contacts/stores/${id}/full`, { headers: authHeaders() });
        if (!r.ok) {
          document.getElementById('closure-history').innerHTML =
            `<em style="color:#9CA3AF;">Couldn't load satellites: ${escapeHtml(await r.text())}</em>`;
          return;
        }
        const full = await r.json();
        modalContext = {
          storeId: id,
          physical:          full.physical          || {},
          technical:         full.technical         || {},
          closures:          full.closures          || [],
          delivery_partners: full.delivery_partners || [],
        };
        // Refresh base store from server too (in case other tabs edited it)
        if (full.store) populateGroup(STORE_SECTIONS.flatMap(s => s.fields), full.store, 'store');
        populateGroup(STORE_PHYSICAL_FIELDS,  modalContext.physical,  'phys');
        populateGroup(STORE_TECHNICAL_FIELDS, modalContext.technical, 'tech');
        renderClosureHistory(modalContext.closures);
        renderDeliveryPartners(modalContext.delivery_partners);
        setEditableState();
      } catch (e) {
        document.getElementById('closure-history').innerHTML =
          `<em style="color:#9CA3AF;">Couldn't load satellites: ${escapeHtml(e.message)}</em>`;
      }
    }

    function renderDeliveryPartners(rows) {
      // Read-only table of DeliveryPartnersByStore rows for this store.
      // Resolves DelivPartID → partner name via the already-loaded
      // LOOKUP_CACHE['deliverypartner'] (no extra fetch).
      const el = document.getElementById('delivery-partners');
      if (!rows || rows.length === 0) {
        el.innerHTML = '<em style="color:#6B7280;font-size:0.85rem;">No delivery partners assigned to this store.</em>';
        return;
      }
      const partnerLookup = {};
      (LOOKUP_CACHE['deliverypartner'] || []).forEach(p => { partnerLookup[p.id] = p.label; });

      // Pick out the most useful columns if they exist; everything else
      // surfaces in a generic dump fallback (same pattern as closure history).
      const sample = rows[0];
      const sampleKeys = Object.keys(sample);
      // The partner FK could be DelivPartID, DeliveryPartnerID, or PartnerID —
      // detect dynamically.
      const fkCol = sampleKeys.find(k => /deliv.*part.*id|partnerid/i.test(k));
      const headers = [];
      if (fkCol) headers.push(fkCol);
      // Common useful columns if present. The first batch are generic
      // mapping-table columns we might encounter; the second batch are the
      // actual SQL Server columns on DeliveryPartnersByStore (per Kim's
      // PRAGMA audit) — URL + merchant ID assigned by the partner.
      ['IsActive', 'Active', 'StartDate', 'EndDate', 'Notes', 'CommissionPct',
       'StoreSpecificFee', 'DeliveryPartnerURL', 'IdAtDeliveryPartner']
        .forEach(c => { if (sampleKeys.includes(c)) headers.push(c); });
      // If nothing matched, fall back to dumping every column that isn't audit.
      if (headers.length === 0) {
        sampleKeys
          .filter(k => !['LastUpdated','LastUpdatedBy','LastEdited','LastEditedBy'].includes(k))
          .forEach(k => headers.push(k));
      }

      let html = `<div style="color:#6B7280;font-size:0.8rem;margin-bottom:0.4rem;">${rows.length} partner mapping(s)</div>`;
      html += '<table style="width:100%;font-size:0.82rem;border:1px solid #E5E7EB;">';
      html += '<thead style="background:#F9FAFB;"><tr>';
      // First column is always partner name (resolved from FK)
      html += '<th style="text-align:left;padding:0.3rem 0.5rem;border-bottom:1px solid #E5E7EB;">Partner</th>';
      headers.filter(h => h !== fkCol).forEach(h => {
        html += `<th style="text-align:left;padding:0.3rem 0.5rem;border-bottom:1px solid #E5E7EB;">${escapeHtml(h)}</th>`;
      });
      html += '</tr></thead><tbody>';
      rows.forEach(r => {
        html += '<tr>';
        const partnerName = fkCol
          ? (partnerLookup[r[fkCol]] || `(unknown #${r[fkCol] ?? '?'})`)
          : '(no FK col detected)';
        html += `<td style="padding:0.3rem 0.5rem;border-bottom:1px solid #F3F4F6;"><strong>${escapeHtml(partnerName)}</strong></td>`;
        headers.filter(h => h !== fkCol).forEach(h => {
          html += `<td style="padding:0.3rem 0.5rem;border-bottom:1px solid #F3F4F6;">${escapeHtml(r[h] ?? '')}</td>`;
        });
        html += '</tr>';
      });
      html += '</tbody></table>';
      el.innerHTML = html;
    }

    function renderClosureHistory(rows) {
      const el = document.getElementById('closure-history');
      if (!rows || rows.length === 0) {
        el.innerHTML = '<em style="color:#6B7280;font-size:0.85rem;">No closures recorded.</em>';
        return;
      }
      // Pick the most useful columns if they exist; everything else surfaces
      // in a "more" tooltip via title attribute.
      const pickCols = ['ClosureDate', 'ReopenDate', 'ClosureType', 'ClosureReason', 'Notes'];
      const headers = pickCols.filter(c => rows.some(r => r[c] != null));
      let html = `<div style="color:#6B7280;font-size:0.8rem;margin-bottom:0.4rem;">${rows.length} closure record(s)</div>`;
      if (headers.length === 0) {
        // Fall back to dumping all fields of the first row's keys.
        const allKeys = Object.keys(rows[0]).filter(k => !['LastUpdated','LastUpdatedBy'].includes(k));
        headers.push(...allKeys.slice(0, 4));
      }
      html += '<table style="width:100%;font-size:0.82rem;border:1px solid #E5E7EB;">';
      html += '<thead style="background:#F9FAFB;"><tr>' +
        headers.map(h => `<th style="text-align:left;padding:0.3rem 0.5rem;border-bottom:1px solid #E5E7EB;">${escapeHtml(h)}</th>`).join('') +
        '</tr></thead><tbody>';
      rows.slice(0, 25).forEach(r => {
        html += '<tr>' +
          headers.map(h => `<td style="padding:0.3rem 0.5rem;border-bottom:1px solid #F3F4F6;">${escapeHtml(r[h] ?? '')}</td>`).join('') +
          '</tr>';
      });
      html += '</tbody></table>';
      if (rows.length > 25) {
        html += `<div style="color:#9CA3AF;font-size:0.78rem;margin-top:0.3rem;">…and ${rows.length - 25} more — full closure-history editing UI is on the roadmap.</div>`;
      }
      el.innerHTML = html;
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('visible');
    }

    // Read one group of fields back out of the form into a plain {col: value} dict.
    function readGroup(fields, group, includeReadonly) {
      const out = {};
      fields.forEach(f => {
        if (f.ro && !includeReadonly) return;
        const el = document.getElementById(`${group}_${f.col}`);
        if (!el) return;
        if (f.type === 'checkbox') {
          out[f.col] = el.checked ? 1 : 0;
        } else if (f.type === 'number' || f.type === 'lookup') {
          const s = (el.value ?? '').toString().trim();
          out[f.col] = s === '' ? null : Number(s);
        } else {
          const s = (el.value ?? '').trim();
          out[f.col] = s === '' ? null : s;
        }
      });
      return out;
    }

    function readForm() {
      // Store payload — include StoreID even though it's `ro` so POST can use it.
      const storePayload = readGroup(
        STORE_SECTIONS.flatMap(s => s.fields), 'store', /*includeReadonly=*/false
      );
      // The above skips StoreID because ro=true; re-read it explicitly.
      const storeIdEl = document.getElementById('store_StoreID');
      if (storeIdEl && storeIdEl.value.trim() !== '') {
        storePayload.StoreID = Number(storeIdEl.value.trim());
      }
      // OLO Vendor ID isn't a Store column — pull it out of the store payload
      // so the Store PUT never sees it; it saves via its own endpoint.
      const oloVendorId = storePayload.OLOVendorID ?? null;
      delete storePayload.OLOVendorID;
      return {
        store:       storePayload,
        oloVendorId: oloVendorId,
        physical:    readGroup(STORE_PHYSICAL_FIELDS,  'phys', false),
        technical:   readGroup(STORE_TECHNICAL_FIELDS, 'tech', false),
      };
    }

    async function onSave() {
      const payload = readForm();
      const storeId = payload.store.StoreID;
      const isNew = !storeId || !allRows.find(r => r.StoreID === storeId);
      const btn = document.getElementById('save-btn');
      btn.disabled = true;
      try {
        // 1) Save the base Store row first (POST for new, PUT for edit).
        let url, method;
        if (isNew) { url = '/api/contacts/stores'; method = 'POST'; }
        else      { url = `/api/contacts/stores/${storeId}`; method = 'PUT'; }
        const r = await fetch(url, { method, headers: authHeaders(), body: JSON.stringify(payload.store) });
        if (r.status === 401) { showError('Sign in required.'); btn.disabled = false; return; }
        if (r.status === 403) { showError('Admin role required.'); btn.disabled = false; return; }
        if (!r.ok) {
          showError(`Store save failed: ${await r.text()}`);
          btn.disabled = false;
          return;
        }

        // 2) Then upsert each satellite via its own endpoint. Skip if the
        // payload is entirely empty (every value null) — avoids creating
        // empty satellite rows for stores that don't have any data yet.
        const hasData = obj => Object.values(obj).some(v => v !== null && v !== '');
        const sideTasks = [];
        // OLO Vendor ID — app-owned, saved via its own endpoint. Always sent
        // (even when blank) so clearing the field deletes the stored value.
        sideTasks.push(fetch(`/api/contacts/stores/${storeId}/olo-vendor`, {
          method: 'PUT', headers: authHeaders(),
          body: JSON.stringify({ OLOVendorID: payload.oloVendorId }),
        }));
        if (hasData(payload.physical)) {
          sideTasks.push(fetch(`/api/contacts/stores/${storeId}/physical`, {
            method: 'PUT', headers: authHeaders(), body: JSON.stringify(payload.physical),
          }));
        }
        if (hasData(payload.technical)) {
          sideTasks.push(fetch(`/api/contacts/stores/${storeId}/technical`, {
            method: 'PUT', headers: authHeaders(), body: JSON.stringify(payload.technical),
          }));
        }
        const results = await Promise.all(sideTasks);
        const sideErrors = [];
        for (const sr of results) {
          if (!sr.ok) sideErrors.push(await sr.text());
        }
        if (sideErrors.length) {
          showError(`Store saved, but satellite save failed: ${sideErrors.join('; ')}`);
        } else {
          showInfo(isNew ? 'Store added.' : 'Store updated.');
        }
        closeModal();
        await loadList();
      } catch (e) {
        showError(`Network error: ${e.message}`);
      } finally {
        btn.disabled = false;
      }
    }

    // ──────────────────────────────────────────────────────────────────────────
    // Wire up
    // ──────────────────────────────────────────────────────────────────────────
    document.getElementById('add-btn').addEventListener('click', () => {
      if (!isAdmin) { showError('Admin role required to add stores.'); return; }
      openAddModal();
    });
    document.getElementById('cancel-btn').addEventListener('click', closeModal);
    document.getElementById('modal-close').addEventListener('click', closeModal);
    document.getElementById('save-btn').addEventListener('click', onSave);
    document.getElementById('search').addEventListener('input', () => render());
    document.getElementById('active-only').addEventListener('change', () => render());
    document.getElementById('modal').addEventListener('click', e => {
      if (e.target.id === 'modal') closeModal();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
    });

    if (!isAdmin) {
      document.getElementById('add-btn').style.opacity = 0.55;
      document.getElementById('add-btn').title = 'Admin role required';
    }

    renderForm();        // build the modal HTML once
    // Prime FK dropdown cache before opening any modal, then load the list.
    // Running in parallel — the modal can wait for lookups via populateLookupOptions
    // if the user clicks fast, but in practice both finish before any click.
    (async () => {
      await loadAllLookups();
      populateLookupOptions();
    })();
    loadList();          // fetch + display data
  </script>
</body>
</html>
