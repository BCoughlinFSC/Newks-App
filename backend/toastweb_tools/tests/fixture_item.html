<!doctype html>
<meta charset="utf-8">
<title>Fixture - Half Ham &amp; Swiss (Pick 3 Entree)</title>
<!-- Replicates ToastWeb's Location Prices markup taken from a real --probe run:
     hidden template row with the INDEX placeholder, an ASYNCHRONOUS "+ Add" that clones
     it keeping the new-location-price- prefix, trash/undo controls, and a Save button.
     Seeded with a full tier ladder so both add and remove jobs have work to do. -->
<style>
  body { font: 14px system-ui, sans-serif; padding: 1rem; }
  table { border-collapse: collapse; }
  td, th { border-bottom: 1px solid #ddd; padding: .3rem .6rem; }
  .td-input input { text-align: right; width: 6rem; }
  a { cursor: pointer; color: #06c; }
  .undo { display: none; }
  tr.removed .remove-entity { display: none; }
  tr.removed .undo { display: inline; }
  tr.removed { opacity: .45; }
</style>

<ul class="breadcrumb"><li>Manage Menus</li><li>Half Ham &amp; Swiss (Pick 3 Entree)</li></ul>
<button id="save">Save</button>

<h3>Location Prices</h3>
<table id="prices">
  <tbody id="tb">
    <tr class="template exclude-from-readonly" style="display:none" id="new-location-price-INDEX">
      <td class="td-select">
        <input type="hidden" name="locationPrices[INDEX].shared" value="false" disabled>
        <select name="locationPrices[INDEX].restaurantSet.id"></select>
      </td>
      <td class="currency">$</td>
      <td class="td-input location-price"><input type="text" name="locationPrices[INDEX].basePrice" value=""></td>
      <td class="td-actions">
        <a class="remove-entity exclude-from-readonly"><i class="icon-trash" title="Remove price"></i>trash</a>
        <a class="undo">undo remove</a>
      </td>
    </tr>
  </tbody>
</table>
<a id="add">+ Add</a>

<script>
// location picker: the three Company Only groups with their REAL Toast ids, plus decoys
const OPTIONS = [
  ["1100000004661469700", "1 - Newk's Eatery Reporting"],
  ["1100000004587241401", "PRICE - Dine-In Tiers"],
  ["1100000019182217600", "Tier 10 - Dine In - Company Only"],
  ["1100000019182223700", "Tier 12 - Dine In - Company Only"],
  ["1100000019181590750", "Tier 8 - Dine In - Company Only"],
  ["1100000000000000001", "Tier 8 Catering"],
  ["1100000000000000002", "Tier 8 - Box Salad Price"],
  ["1100000000000000003", "Tier 7 & 8 - Box Sandwich & Wrap"],
];
const sel = document.querySelector('#new-location-price-INDEX select');
for (const [v, t] of OPTIONS) {
  const o = document.createElement('option');
  o.value = v; o.textContent = t; sel.appendChild(o);
}

// full ladder, including the plain 8/10/12 rows so the remove job has work
window.__SEED = [
  ["*System Newk's Eatery", "12.99"],
  ["1.1 - Tier 7 - Dine In", "13.29"],
  ["1.2 - Tier 8 - Dine In", "13.49"],
  ["1.3 - Tier 9 - Dine In", "13.79"],
  ["2.1 - Tier 10 - Dine In", "13.99"],
  ["2.2 - Tier 11 - Dine In", "14.29"],
  ["2.3 - Tier 12 - Dine In", "14.49"],
  ["2.4 - Tier 13 - Dine In", "14.49"],
  ["2.5 - Tier 14 - Dine In", "14.79"],
  ["2.6 - Tier 15 - Dine In", "14.99"],
  ["2.9 - Tier 18 - Dine In", "14.99"],
  ["3.0 - Tier 19 - Dine In", "15.29"],
  ["Tier 10 - Dine In - Company Only", "13.99"],
  ["Tier 12 - Dine In - Company Only", "14.49"],
  ["2.8 - Custom MDH - Dine In", "14.39"],
  ["2.9 - Custom SWR - Dine In", "12.99"],
];
const tb = document.getElementById('tb');
window.__SEED.forEach(([label, price], i) => {
  const tr = document.createElement('tr');
  tr.id = 'location-price-11000000' + (100000 + i);
  tr.className = 'exclude-from-readonly';
  tr.innerHTML =
    '<td><a href="#">' + label.replace(/&/g, '&amp;') + '</a></td>' +
    '<td class="currency">$</td>' +
    '<td class="td-input location-price"><input type="text" value="' + price + '"></td>' +
    '<td class="td-actions"><a class="remove-entity"><i class="icon-trash"></i>trash</a>' +
    '<a class="undo">undo remove</a></td>';
  tb.appendChild(tr);
});

// "+ Add" clones the template ASYNCHRONOUSLY, keeping the new-location-price- prefix,
// exactly as Toast does -- this is what broke an earlier version of the engine.
let addSeq = 0;
document.getElementById('add').addEventListener('click', () => {
  setTimeout(() => {
    const tpl = document.getElementById('new-location-price-INDEX');
    const row = tpl.cloneNode(true);
    const n = addSeq++;
    row.id = 'new-location-price-' + n;
    row.classList.remove('template');
    row.style.display = '';
    row.querySelectorAll('[name]').forEach((el) => {
      el.name = el.name.replace('INDEX', String(n));
      el.disabled = false;
    });
    tb.appendChild(row);
  }, 250);
});

tb.addEventListener('click', (e) => {
  const rm = e.target.closest('.remove-entity');
  if (rm) { rm.closest('tr').classList.add('removed'); return; }
  const un = e.target.closest('.undo');
  if (un) un.closest('tr').classList.remove('removed');
});

window.__saved = null;
document.getElementById('save').addEventListener('click', () => {
  window.__saved = [...tb.querySelectorAll('tr')]
    .filter((tr) => !tr.classList.contains('template') && !tr.classList.contains('removed'))
    .map((tr) => {
      const a = tr.querySelector('td a');
      const s = tr.querySelector('select');
      const label = s
        ? (s.options[s.selectedIndex] ? s.options[s.selectedIndex].text : '(none)')
        : (a ? a.textContent.trim() : '');
      const i = tr.querySelector('td.location-price input');
      return { label: label, price: i ? i.value : '' };
    });
});
</script>
